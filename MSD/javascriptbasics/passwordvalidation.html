<html>
    <body>
<input type="text" id="pass" placeholder="Enter password">
        <div id="valid">
    <h6 id="len_pass" style="color: red;">length must be 8 characters</h6>
    <h6 id="upper_pass" style="color: red;">one upper case</h6>
    <h6 id="lower_pass" style="color: red;">one lower case</h6>
    <h6 id="num_pass" style="color: red;">one number</h6>
        </div>
    <script>
        document.getElementById("pass")
            .addEventListener("keyup", ()=>{
            let pass_len = document.getElementById("pass").value.length;
            //HIDE AND VIEW 
            if(pass_len > 0){
                document.getElementById("valid").style.display = "block";
            }else{
                document.getElementById("valid").style.display = "none";
            }
        //checking first condition the length is >=8
        if(pass_len >= 8){
            document.getElementById("len_pass").style.color = "green";
        }else{
            document.getElementById("len_pass").style.color = "red";
        }
        //checking for upper
        let pass = document.getElementById("pass").value;
        if(/[A-Z]/.test(pass)){
            document.getElementById("upper_pass").style.color = "green";
        }else{
            document.getElementById("upper_pass").style.color = "red";
        }
        //checking for lower
        if(/[a-z]/.test(pass)){
            document.getElementById("lower_pass").style.color = "green";
        }else{
            document.getElementById("lower_pass").style.color = "red";
        }
        //checking for number
        if(/[0-9]/.test(pass)){
            document.getElementById("num_pass").style.color = "green";
        }else{
            document.getElementById("num_pass").style.color = "red";
        }
        });
    </script>
    
</body>
</html>
